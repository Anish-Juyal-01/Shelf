[workspace]
members = ["core", "cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Anish Juyal"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
