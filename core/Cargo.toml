[package]
name = "shelf-core"
description = "Shelf's engine: finds every game on a Windows PC, read-only."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
fancy-regex = "0.14"
unicode-normalization = "0.1"
roxmltree = "0.20"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
ureq = "2.12"
notify = "8"
png = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Performance"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
